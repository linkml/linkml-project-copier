[tool.uv]
# Dependency cooldown: ignore releases newer than 7 days so malware/CVE
# advisories have time to surface before a version is adopted. This repo does
# not commit uv.lock, so the span is applied at resolution time in CI/locally.
# Requires uv >= 0.9.17.
exclude-newer = "7 days"

[dependency-groups]
test = [
    "copier>=9.4.0",
    "jinja2-time",
    "pytest>=8.0",
    "pyyaml",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that run just commands in generated projects (slow)",
]
